<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[620px] h-[551px] rounded-[28px] border p-[40px] flex flex-col justify-between bg-[#19231E8C] border-[#FFFFFF26]">
          <div class="w-[540px] h-[44px] flex justify-between">
            <div class="w-[44px] h-[44px] rounded-[12px] bg-[#B5CBB21A] flex justify-center items-center text-[#C5D9BD]">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-timer preview-icon"
              >
                <line x1="10" x2="14" y1="2" y2="2" />
                <line x1="12" x2="15" y1="14" y2="11" />
                <circle cx="12" cy="14" r="8" />
              </svg>
            </div>
            <div class="w-[62px] h-[29px] rounded-[99px] border border-[#C5D9BD26] p-[6px_12px] bg-[#B5CBB20D] flex justify-center items-center text-[12px] text-[#C5D9BD]">Ready</div>
          </div>
          <div>
            <div class="text-[40px] tracking-[-1] text-[#F0FDF4] font-inter">Stopwatch</div>
            <span class="text-[14px] text-[#A4B9AD]">Make time for what matters.</span>
          </div>
          <div class="w-[540px] h-[1px] bg-[#B5CBB226]"></div>
          <div class="flex w-[540px] h-[86px] justify-between">
            <div class="flex flex-col w-[166.67px] h-[86px] gap-[16px] justify-center items-center text-[56px] tracking-[-2px] font-mono font-light text-[#EDF3E8]">00 <span class="text-[9px] font-[inter] font-medium tracking-[2px] text-[#9BAD9E]">HOURS</span></div>
            <div class="w-[20px] h-[56px] text-[40px] font-[Roboto Mono] text-[#5C7161]">:</div>
            <div class="flex flex-col w-[166.67px] h-[86px] gap-[16px] justify-center items-center text-[56px] tracking-[-2px] font-mono font-light text-[#EDF3E8]">00 <span class="text-[9px] font-[inter] font-medium tracking-[2px] text-[#9BAD9E]">MINUTES</span></div>
            <div class="w-[20px] h-[56px] text-[40px] font-[Roboto Mono] text-[#5C7161]">:</div>
            <div class="flex flex-col w-[166.67px] h-[86px] gap-[16px] justify-center items-center text-[56px] tracking-[-2px] font-mono font-light text-[#EDF3E8]">00 <span class="text-[9px] font-[inter] font-medium tracking-[2px] text-[#9BAD9E]">SECONDS</span></div>
          </div>
          <div class="w-[540px] h-[1px] bg-[#B5CBB226]"></div>
          <div class="flex gap-[12px]">
            <button type="button" disabled class="cursor-pointer w-[258px] h-[48px] rounded-[12px] bg-[#B5CBB2] text-[14px] text-[#102418] font-semibold flex justify-center items-center disabled:cursor-not-allowed disabled:opacity-35">Start</button>
            <button type="button" disabled class="cursor-pointer w-[129px] h-[48px] rounded-[12px] border bg-[#FFFFFF0D] border-[#FFFFFF1A] text-[14px] text-[#DCECE2] flex justify-center items-center disabled:cursor-not-allowed disabled:opacity-35">Pause</button>
            <button type="button" disabled class="cursor-pointer w-[129px] h-[48px] rounded-[12px] border border-[#FFFFFF1A] opacity-[35%] text-[14px] text-[#A4B9AD] flex justify-center items-center">Reset</button>
          </div>
          <div class="w-[540px] h-[16px] text-[12px] text-[#8AA294] flex justify-center items-center">A moment of focus. At your own pace.</div>
        </div>
      </div>
    </div>
  </body>
</html>
