<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]"
  >
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65"
          >The everyday collection / 03</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="flex flex-col">
          <div class="w-[1240px] h-[104px] flex justify-between">
            <div
              class="flex flex-col text-[30px] text-[#F4F4F5] font-inter font-semibold"
            >
              Color palettes.
              <span class="text-[14px] text-[#A1A1AA] font-normal"
                >Generated shades with Tailwind color names. Click a shade to
                copy its HEX background color.</span
              >
            </div>
            <div type="button" id="generate"
              class="w-[186px] h-[48px] rounded-[12px] gap-[8px] bg-[#D9F99D] flex justify-center items-center cursor-pointer"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="10"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#09090B"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-shuffle preview-icon"
              >
                <path d="m18 14 4 4-4 4" />
                <path d="m18 2 4 4-4 4" />
                <path
                  d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"
                />
                <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
                <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
              </svg>
              <span class="text-[14px] text-[#09090B] font-semibold"
                >Shuffle palettes</span>
            </div>
          </div>
          <div class="w-[1240px] h-[55px] flex justify-between items-center">
            <div class="text-[12px] text-[#A1A1AA] font-medium">
              100 → 950 · LIGHT TO DARK
            </div>
            <div id="status" class="text-[12px] text-[#A1A1AA]">Ready to explore.</div>
          </div>
          <div id="colors" class="w-full  flex flex-col gap-7">
            <!-- <div  class="w-full h-[136px] gap-3 flex flex-col ">
              <div  class="text-[14px] text-[#E4E4E7] font-semibold capitalize w-[27px] h-[17px]">Red</div>
              <div  class="w-full h-[107px] gap-3 flex">
                <div  class="w-[113px] h-[107px] flex flex-col items-center justify-center">
                  <button type="button" class="w-full h-16 rounded-xl cursor-pointer bg-[#FDE3E3] flex"></button>
                  <span class="w-[38px] h-[43px] pt-2 pb-1px gap-1 flex flex-col font-medium text-3 text-[#D4D4D8] items-center justify-center">100
                    <span class="text-[9px] text-[#A1A1AA] font-mono font-normal">#FDE3E3</span>
                  </span>
                </div>
              </div>
            </div> -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
