<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[576px] h-[575px] rounded-[24px] border p-[32px] border-[#27272A] bg-[#18181B] flex flex-col justify-between">
          <div class="text-[24px] text-[#F4F4F5] font-semibold flex flex-col gap-[8px]">
            Reaction time <span class="text-[14px] text-[#A1A1AA] font-normal">Wait for green, then click as quickly as you can.</span>
          </div>
          <div class="w-[512px] h-[256px] bg-[#27272A] rounded-[16px] gap-[12px] flex flex-col justify-center items-center">
            <div>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#F4F4F5"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-dot preview-icon"
              >
                <circle cx="12" cy="12" r="1" />
                <circle cx="12" cy="12" r="10" />
              </svg>
            </div>
            <div class="text-[24px] text-[#F4F4F5] font-semibold ">Ready when you are</div>
            <div class="text-[14px] text-[#F4F4F5] ">Click to start</div>
          </div>
          <div class="w-[512px] h-[84px] gap-[12px] flex">
            <div class="w-[250px] h-[84px] rounded-[12px] gap-[4px] flex flex-col items-center justify-center bg-[#27272A] text-[#D9F99D] text-[24px]">— <span class="text-[12px] text-[#A1A1AA]">Last attempt</span></div>
            <div class="w-[250px] h-[84px] rounded-[12px] gap-[4px] flex flex-col items-center justify-center bg-[#27272A] text-[#D9F99D] text-[24px]">— <span class="text-[12px] text-[#A1A1AA]">Best this session</span></div>
          </div>
          <div class="w-[512px] h-[40px] text-[12px] text-[#A1A1AA] leading-[20px] text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</div>
        </div>
      </div>
    </div>
  </body>
</html>
